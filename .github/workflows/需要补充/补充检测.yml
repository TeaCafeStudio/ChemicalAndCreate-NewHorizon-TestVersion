name: Auto Close or Remove Label on Supplement Issues

on:
  issues:
    types:
      - edited
  schedule:
    - cron: '0 */6 * * *'  # 每 6 小时检查一次

permissions:
  issues: write

jobs:
  check-supplement:
    runs-on: ubuntu-latest

    steps:
      - name: Check and process supplement issues
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: '✒️需要补充',
              state: 'open',
              per_page: 100
            });

            for (const issue of issues) {
              const labeledAt = new Date(issue.created_at);
              const now = new Date();
              const hoursDiff = (now - labeledAt) / (1000 * 60 * 60);

              // 如果 Issue 在标记后被编辑，移除标签
              if (issue.updated_at > issue.created_at) {
                const labeledTime = new Date(issue.created_at);
                const updatedTime = new Date(issue.updated_at);
                
                // 检查是否有 ✒️需要补充 标签且在标记后被编辑
                if (updatedTime > labeledTime && issue.labels.some(l => l.name === '✒️需要补充')) {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    name: '✒️需要补充'
                  });

                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    body: "感谢你的补充！✒️需要补充 标签已移除。\n\nThank you for the update! The ✒️Needs Supplement label has been removed."
                  });
                }
              }
              // 如果超过 72 小时未更新，关闭 Issue
              else if (hoursDiff >= 72) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed'
                });

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: "由于该 Issue 在 72 小时内未进行补充更新，现已自动关闭。若需重新开启，请根据反馈进行更新后评论申请。\n\nThis issue has been automatically closed because it was not updated within 72 hours. If you need to reopen it, please update it according to the feedback and comment to request reopening."
                });
              }
            }
